id: filtered30-smoke
description: Smoke experiment for factorial runs over the AIGameDevBench filtered testcase set.

task_sets:
  filtered30:
    testcases_dir: testcases_filtered
    testcases:
      - hard-mode-difficulty-preset
      - platformer-jump-retune
      - collision-layer-precise-edit
      - component-layer-boundary

harness_presets:
  gd-baseline:
    components: {}
  gd-skill:
    components:
      skills:
        - godot-debugging

cells:
  - id: baseline_filtered_smoke
    model: smoke-model
    agent_cli: patch
    orchestration:
      id: single-agent
      source_type: builtin
    task_set: filtered30
    harness:
      preset: gd-baseline

  - id: skill_filtered_smoke
    model: smoke-model
    agent_cli: patch
    orchestration:
      id: single-agent
      source_type: builtin
    task_set: filtered30
    harness:
      preset: gd-skill
