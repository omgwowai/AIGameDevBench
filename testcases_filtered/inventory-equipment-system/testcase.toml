godot_version = "4.5-stable"
source_repo = "authored:representative-set"
task = """
Implement the inventory and equipment systems across res://scripts/inventory.gd and res://scripts/equipment.gd.

Inventory (slot-limited, stacking):
- capacity is the maximum number of distinct SLOTS (stacks), not total items.
- add(item_id, qty): if a stack for item_id already exists, increase its quantity (no new slot). Otherwise, if a free slot exists, create a new stack with that quantity. If all slots are full and the item is not already stacked, add nothing and return false. Return true when something was added.
- total_quantity() = sum of all stack quantities; slot_count() = number of occupied slots.

Equipment (one item per slot, attack bonus):
- equip(slot, bonus): if that slot already holds something, remove its bonus first, then apply the new bonus. total_bonus = sum of currently-equipped slots. Re-equipping the same slot must REPLACE, never double-count.
- unequip(slot): remove that slot's item and its bonus.
"""

