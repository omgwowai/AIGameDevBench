task = """
The platformer player tuning lives in res://data/player_tuning.json (move_speed, gravity, jump_velocity).
Jump apex height is jump_velocity^2 / (2*gravity); hang time is 2*jump_velocity/gravity.
Design wants the jump to reach DOUBLE the current apex height while keeping the SAME hang time. Update the tuning values accordingly. Do not change move_speed.
"""

