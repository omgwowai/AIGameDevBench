godot_version = "4.5-stable"
snapshot = "stardive_kugutsushi__ee84ed2"
source_repo = "survey:stardive_kugutsushi (offline snapshot)"
task = """
In this tavern sim, when an NPC is knocked out (gains the incapacitating `stunned` buff) other NPCs are supposed to be able to come to the rescue. The `rescue_npc` behavior (res://configs/ai_catalog/behaviors.json) is a global behavior whose target_query resolves the NEAREST_NPC carrying the `stunned` buff, and its whole point is that rescue availability binds to that fainted/incapacitated STATE — anyone should be able to come help, not only NPCs who happen to be standing right next to the victim.

Two things are broken:
- The rescue is over-gated by distance. `rescue_npc`'s target_query has `max_distance = 500.0`, so a would-be rescuer standing farther than 500px from a stunned NPC never sees `rescue_npc` as a valid candidate (TargetResolver.NEAREST_NPC drops the target on distance). Rescue should be gated on the stunned state, not proximity — widen the reach so a distant NPC still gets the rescue option while someone is stunned.
- Going down is silent. When an NPC gains an incapacitating buff, `_on_buff_added` (res://scripts/actors/npc.gd) updates local visuals but never tells the world, so nearby NPCs are never interrupted to reconsider and come help. Emit an `npc_incapacitated` world event (via EventBus.emit_game_event) from `_on_buff_added` when the NPC goes down, carrying the fallen NPC as source/actor so it can drive a rethink.

The observable contract: while a victim is `stunned`, a valid `rescue_npc` candidate must be offered to another NPC regardless of distance, and the moment the victim goes down an `npc_incapacitated` event must be broadcast on the EventBus.
"""

