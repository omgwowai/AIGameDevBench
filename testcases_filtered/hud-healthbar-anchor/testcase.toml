notes = "visual_audio/easy. visual_static runs in --script mode (verifier extends SceneTree, loads the scene itself). Trap: AI nudges raw offsets instead of changing anchors, so it breaks on resize. Baseline HealthBar uses default 0 anchors -> noop=0. Golden anchors to top-right (anchor_left=anchor_right=1.0) -> 1.0."
