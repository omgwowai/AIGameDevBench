task = """
The HealthBar in res://scenes/hud.tscn is currently placed with raw top-left offsets, so it drifts away from the corner when the window is resized. Re-anchor the HealthBar to the TOP-RIGHT corner of the HUD: set anchor_left and anchor_right to 1.0 and anchor_top and anchor_bottom to 0.0, and adjust the offsets (negative left/right offsets) so the bar still appears at the top-right with its current size. It must stay pinned to the right edge on resize.
"""

