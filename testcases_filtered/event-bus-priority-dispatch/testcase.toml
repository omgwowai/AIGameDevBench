godot_version = "4.5-stable"
source_repo = "authored:representative-set"
task = """
Implement the priority event bus in res://scripts/event_bus.gd.
- subscribe(id, priority): register a subscriber. Higher priority is dispatched FIRST; ties dispatch in subscription (insertion) order. Re-subscribing an existing id updates its priority.
- unsubscribe(id): remove a subscriber so it is never dispatched again.
- publish(): clear dispatch_log, then append each current subscriber's id to dispatch_log in dispatch order (priority descending, ties by insertion order).
- publish_removing(remove_id): unsubscribe remove_id BEFORE dispatching, then dispatch like publish(); remove_id must not appear and the remaining order must be unaffected.
"""

