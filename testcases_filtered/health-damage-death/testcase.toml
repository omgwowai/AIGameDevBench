task = """
Implement the damage/death logic in res://scripts/health.gd.
- take_damage(amount) reduces health by amount but health must clamp at 0 (never go negative).
- When health reaches 0, set is_dead = true and emit the `died` signal.
- `died` must fire EXACTLY ONCE: further damage after death must not re-emit it and must not push health below 0.
"""

