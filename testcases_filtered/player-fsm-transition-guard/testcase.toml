godot_version = "4.5-stable"
source_repo = "authored:representative-set"
task = """
Complete the player state machine in res://scripts/state_machine.gd. change_state(target_name) must:
- reject the transition when the current state does not allow it (current.can_transition_to(target_name) is false): return false, leave `current` unchanged, and call NO enter()/exit();
- otherwise call exit() on the current state, then enter() on the new state, update `current` to the new state, and return true.
States declare their legal targets via the `allowed` array (e.g. jump only allows "idle", so jump->jump is illegal). Do not change state.gd.
"""

