task = """
res://scripts/spawner.gd spawns a goblin by building a hardcoded "res://entities/goblin.tscn" path string at the call site and passing it to load(). Refactor so the goblin scene is referenced through a preload()'d constant (or @export) instead of a hardcoded path literal living loose in the function body. The script must keep spawning the goblin correctly; only the way the scene resource is referenced should change.
"""

