notes = "architecture/med. forbid_hardcoded_res_path: a res:// literal is allowed only when it sits directly inside preload()/load(). Baseline stores the path in a var then load(var) -> the literal is flagged -> penalty 100 -> score 0. Golden uses const PRELOAD := preload(\"res://...\") -> only-in-preload -> rule passes -> 1.0. Trap: AI keeps the hardcoded string and just tidies code -> still 0."
