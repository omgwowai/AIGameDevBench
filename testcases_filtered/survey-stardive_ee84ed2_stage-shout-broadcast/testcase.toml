notes = "Real behavior-logic fix from stardive_kugutsushi (commit ee84ed2, parent 423dcec). Baseline never broadcasts a world event when a stage show starts / shouts, so nearby bystanders are never interrupted to rethink and the performance is ignored. good.diff is the golden fix (behavior_runner.gd emits performance_started / performance_shout; events.json adds distance-gated interrupt reactions; behaviors.json/events.json whitespace-normalized by the tool). Adapted from the fix's own regression test tools/test_stage_show.gd (the bystander interrupt assertion). Snapshot generated on demand by scripts/make_snapshots.py."
