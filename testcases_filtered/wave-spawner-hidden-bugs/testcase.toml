task = """
res://scripts/wave_spawner.gd drives enemy waves and already runs, but it is buggy. Find and fix the bugs so it satisfies this contract:
- start() begins wave 0 and spawns its FULL size (wave_sizes[0] enemies).
- notify_enemy_killed() decrements the live count; when live reaches 0 it advances to the next wave and spawns that wave at its full size.
- after the LAST wave is cleared, emit all_waves_cleared EXACTLY ONCE and set finished = true; do not spawn any further wave.
- spawned_total must equal the sum of all wave sizes once everything is cleared.
The bugs are subtle (off-by-one and boundary conditions). Do not change the public API (signals, methods, exported wave_sizes).
"""

