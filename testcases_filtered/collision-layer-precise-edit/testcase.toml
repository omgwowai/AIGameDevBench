notes = "precise_edit/easy. Trap: AI sets Player.collision_layer but also disturbs ANOTHER node (e.g. the Enemy's layer). py_tscn_diff detects side effects at node-path granularity, so a cross-node disturbance -> no_side_effects fails -> 0.5; a clean single-node edit -> 1.0; missing the intended change -> 0. noop=0. (Same-node extra prop edits are not flagged by this verifier — the discriminating trap is cross-node.)"
