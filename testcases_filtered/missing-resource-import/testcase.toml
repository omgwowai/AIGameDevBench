notes = "precise_edit/easy. Mined from a real Codex Godot session (GameDevFeatsShowcase) where a scene referenced res://assets/player.svg with no import, and headless boot kept failing with 'No loader found for resource ... expected type: Texture2D' + Parse Error. Baseline main.tscn has an ext_resource pointing at a NON-EXISTENT file -> godot --import can't recreate it -> L0 load crashes -> noop=0. Golden swaps the missing external texture for an in-scene PlaceholderTexture2D (64x64) so the scene loads and the Player sprite has a real texture -> patch=1.00."
