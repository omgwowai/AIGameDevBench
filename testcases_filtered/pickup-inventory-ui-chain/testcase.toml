[testcase]
id = "pickup-inventory-ui-chain"
category = "behavior_logic"
source_kind = "folder"
info_level = "spec"
godot_version = "4.5-stable"
source_repo = "authored:representative-set"
task = """
Wire up the pickup -> inventory -> HUD chain across res://scripts/inventory.gd and res://scripts/hud_label.gd.
- Inventory.add_item() increments count and emits inventory_changed(count).
- Inventory.collect_pickup(id) is idempotent per id: collecting the same id twice must NOT change the count; a new id calls add_item().
- HudLabel.bind(inventory) connects inventory_changed to _on_inventory_changed so the label text always shows the current count.
The label must reflect the count through the signal (do not poll), and re-collecting the same pickup must not double-count.
"""

