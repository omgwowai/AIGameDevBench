notes = "behavior_logic/hard. Two traps: (a) signal/bind not wired -> UI never updates; (b) collect_pickup not idempotent -> double-count on re-entry. Baseline does neither -> noop=0. bad.diff wires signal+bind+emit but leaves collect_pickup non-idempotent -> fails idempotent checkpoint -> 2/5 = 0.4. Golden does both -> 1.0."
