godot_version = "4.5-stable"
source_repo = "authored:representative-set"
task = """
res://components/health_component.gd is meant to be a reusable gameplay component: it must extend a plain Node (not a UI type) and must NOT depend on the ui/ layer. Right now it `extends Control` and `preload()`s res://ui/health_bar.gd, which couples the gameplay layer to the UI layer.
Refactor health_component.gd so it extends Node and no longer imports anything from ui/. Keep the take_damage()/health-tracking behavior; instead of reaching into the UI directly, expose the health state (e.g. a signal or a getter) so the UI layer can observe it. Do not move the rule-checking into other files.
"""

